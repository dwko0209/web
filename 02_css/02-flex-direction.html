<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex_direction</title>
    <link rel="stylesheet" href="default.css">
    <style>
        .flex_container{
            display: flex;
            flex-direction: row; 
            /* 기본값: 아이템들이 행 (가로) 방향으로 배치*/
            flex-direction: column;
            flex-direction: row-reverse;  
            flex-direction: column-reverse;
            gap: 10px;
        }
    </style>
</head>
<body>
        <div class="flex_container">
        <div class="flex_item">aaaaaaaaaa</div>
        <div class="flex_item">bbbbbbbb</div>
        <div class="flex_item">ccccccccc</div>
        </div>

</body>
</html>
