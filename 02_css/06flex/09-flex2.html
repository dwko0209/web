<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
     <link rel="stylesheet" href="default.css">
    <style>
        .flex_container {
            display: flex;
            flex-wrap: wrap;
            width: 1360px;
            margin: 0;
        }

        .flex_item {
            flex: 1 1 auto;
        }

        .flex_item:nth-child(1) {
            width: 30%;
        }

        .flex_item:nth-child(2) {
            width: 60%;
        }

        .flex_item:nth-child(3) {
            width: 20%;
        }
    </style>
</head>

<body>
    <div class="flex-container">
        <div class="flex-item">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Incidunt, eum eius ut laudantium eveniet dolor
                voluptates voluptate, dolorem deleniti dignissimos aut consectetur soluta ex totam tempore ipsa sapiente
                praesentium nam.</p>
        </div>
        <div class="flex-item">bbb</div>
        <div class="flex-item">cccccc</div>

    </div>
</body>

</html>
