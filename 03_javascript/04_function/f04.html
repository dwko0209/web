    <script>
    //prompt로 이름 받아 오기 (uName)

    //prompt로 나이 받아 오기 (uAge)

    //함수 printMsg(이름,나이) 선언 ->함수선언문

    //호출uName,uAge
   
    const uName = prompt('학생 이름을 입력하세요');
    const uAge = prompt('학생 나이를 입력하세요');
     const printMsg = (uName,uAge) =>{
     document.write(`학생이름 : <b>${uName}</b><br>`);
            document.write(`학생나이 : <b>${uAge}</b><br>`);
     }
  
     printMsg('변우석',20);
    </script>
