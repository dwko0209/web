<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box-shadow 연습</title>
    <style>
        div{
            width: 200px;
            height: 300px;
            margin: 30px;
            border: 5px solid;
            text-align: center;
            display: inline-block;
            line-height: 200px;
        }
        .box1{
            color: pink;
            box-shadow: 10px -5px 10px 0 violet;
        }
        .box2{
            font-size: 2em;
            box-shadow: 15px -9px 5px 2px black;
        }
        .box3{
            font-size: 1.5em;
            font-weight: 300;
            color: blueviolet;
            box-shadow: 20px -5px 17px 0 khaki;
        }
        .box4{
            color: aqua;
            box-shadow: 10px -5px 20px 0 blue;
        }
        .box5{
            color: bisque;
            font-size: medium;
            box-shadow: 10px -8px 5px 2px greenyellow;
        }
        .box6{
            font-size: 4.5em;
            color: red;
            box-shadow: 10px -5px 10px 0 violet;
        }
    </style>
</head>

<body>
    <div class="box1">박스1</div>
    <div class="box2">박스2</div>
    <div class="box3">박스3</div>
    <div class="box4">박스4</div>
    <div class="box5">박스5</div>
    <div class="box6">박스6</div>
</body>

</html>
