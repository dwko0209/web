<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스 모델의 테두리 스타일 지정 연습</title>
    <style>
        .box1{
            border-style: solid;
        }
        .box2{
            border-style: dotted;
            margin: 10px;
            padding: 20px;
            border-color: red;
        }
        .box3{
            border-style: dashed;
            width: 200px;
            height: 100px;
            margin: 5px;
            padding: 10px;
            border-top-color: blueviolet;
            border-left-color: aquamarine;
            border-bottom-color: chartreuse;
            border-right-color: coral;
            text-align: center;
        }

    </style>
</head>
<body>
    <div class="box1">실선 테두리</div>
    <div class="box2">점선 테두리</div>
    <div class="box3">짧은직선 테두리</div>
</body>
</html>
