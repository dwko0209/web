<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gradient 연습</title>
    <style>
        div {
            width: 500px;
            height: 500px;
            margin: 10px;
        }

        .gr1 {
            background: linear-gradient(135deg, #ff8a1e 0%, #ffe2a6 100%);
        }

        .gr2 {
            background: conic-gradient(from 135deg at 50% 50%, #ff8a1e 0 0%, #ffe2a6 100%, #ff8a1e 100%);
        }

        .gr3 {
            background: linear-gradient(135deg, color-mix(in oklch, #ff8a1e 18%, white), transparent 62%),
                radial-gradient(ellipse at 20% 30%, #ff8a1e 0 18%, transparent 52%),
                radial-gradient(ellipse at 78% 42%, #ffe2a6 0 20%, transparent 56%),
                linear-gradient(180deg, color-mix(in oklch, #ffe2a6 38%, white), color-mix(in oklch, #ff8a1e 24%, black));
        }

        .gr4 {
            background: linear-gradient(138deg, rgba(255, 255, 255, .5), transparent 24%, rgba(255, 255, 255, .22) 58%, transparent 78%),
                conic-gradient(from 138deg at 50% 52%, #ff8a1e, #a78bfa, #ffe2a6, #22c55e, #ff8a1e);
            ;
        }

        .gr5 {
            background: radial-gradient(circle at 50% 22%, rgba(255, 255, 255, .78) 0 10%, transparent 34%),
                radial-gradient(circle at 18% 28%, color-mix(in oklch, #ff8a1e 45%, transparent) 0 16%, transparent 44%),
                radial-gradient(circle at 82% 76%, color-mix(in oklch, #22d3ee 45%, transparent) 0 18%, transparent 48%),
                linear-gradient(90deg, color-mix(in oklch, color-mix(in oklch, #ff8a1e 45%, transparent) 24%, transparent) 1px, transparent 1px),
                linear-gradient(0deg, color-mix(in oklch, color-mix(in oklch, #ff8a1e 45%, transparent) 18%, transparent) 1px, transparent 1px),
                linear-gradient(151deg, color-mix(in oklch, color-mix(in oklch, #fef3c7 45%, transparent) 90%, white), color-mix(in oklch, color-mix(in oklch, #ffe2a6 45%, transparent) 20%, color-mix(in oklch, #fef3c7 45%, transparent)));
        }

        .gr6 {
            background: repeating-radial-gradient(ellipse at 18% 26%, transparent 0 24px, color-mix(in oklch, color-mix(in oklch, #ff8a1e 45%, transparent) 28%, transparent) 25px 26px, transparent 27px 48px),
                repeating-radial-gradient(ellipse at 82% 72%, transparent 0 28px, color-mix(in oklch, color-mix(in oklch, #22d3ee 45%, transparent) 24%, transparent) 29px 30px, transparent 31px 54px),
                radial-gradient(circle at 18% 24%, color-mix(in oklch, #ff8a1e 45%, transparent) 0 16%, transparent 46%),
                radial-gradient(circle at 82% 18%, color-mix(in oklch, #22d3ee 45%, transparent) 0 18%, transparent 48%),
                radial-gradient(circle, rgba(255, 255, 255, .16) 0 1px, transparent 1px),
                linear-gradient(151deg, color-mix(in oklch, color-mix(in oklch, #ffe2a6 45%, transparent) 84%, black), color-mix(in oklch, color-mix(in oklch, #ff8a1e 45%, transparent) 20%, color-mix(in oklch, #ffe2a6 45%, transparent)));
        }
    </style>
</head>

<body>
    <div class="gr1"></div>
    <div class="gr2"></div>
    <div class="gr3"></div>
    <div class="gr4"></div>
    <div class="gr5"></div>
    <div class="gr6"></div>
</body>

</html>
