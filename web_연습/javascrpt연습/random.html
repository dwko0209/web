<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤</title>
</head>

<body>
    <script>
        let seed = prompt("전체 응모자 수 : ", "");
        let picked = Math.floor((Math.random() * seed) + 1);
        document.write(`<p> 전체 응모자 수 : ${seed}명</p>`);
        document.write(`<p> 당첨자 : ${picked}번</p>`);
    </script>
</body>

</html>
